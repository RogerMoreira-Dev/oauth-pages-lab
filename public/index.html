<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratório de autenticação</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <main class="panel">
    <h1>LABORATÓRIO<span>DE AUTENTICAÇÃO</span></h1>
    <p id="status">A sessão ainda não foi consultada.</p>

    <div class="actions">
      <a href="/oauth/login/google" class="btn btn-google">
        <span>Entrar com Google</span>
      </a>
      <a href="/oauth/login/github" class="btn btn-github">
        <span>Entrar com GitHub</span>
      </a>
    </div>

    <form method="post" action="/oauth/logout" class="logout-form">
      <button type="submit" class="btn btn-logout">Sair</button>
    </form>
  </main>

  <script src="/app.js"></script>
</body>
</html>
